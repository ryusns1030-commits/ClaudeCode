<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Instagram運用 解説動画</title>
<link rel="stylesheet" href="node_modules/@fontsource/m-plus-rounded-1c/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/m-plus-rounded-1c/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/m-plus-rounded-1c/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/m-plus-rounded-1c/900.css">
<style>
:root{
  --ink:#2b2340; --sub:#6b6280; --line:#ece6f2;
  --ig1:#7b3fe4; --ig2:#e1306c; --ig3:#f77737; --ig4:#fcaf45;
  --gpt:#10a37f; --H:#f0627f; --K:#2f5fb3; --warn:#e8473f; --ok:#18a874;
  --paper:#ffffff; --bg1:#fff6ee; --bg2:#fbeaf3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
body{font-family:"M PLUS Rounded 1c",IPAGothic,sans-serif;color:var(--ink);font-weight:500}
#stage{position:absolute;inset:0;overflow:hidden;background:linear-gradient(135deg,var(--bg1),var(--bg2))}
.blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.55}
#dots{position:absolute;inset:0;background-image:radial-gradient(#e9d8ea 2.2px,transparent 2.4px);background-size:44px 44px;opacity:.7}
#topbar{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:18px;padding:0 40px}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:26px;color:var(--ink)}
.brand .logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(45deg,var(--ig4),var(--ig3),var(--ig2),var(--ig1));display:grid;place-items:center}
.brand .logo i{width:22px;height:22px;border:3.5px solid #fff;border-radius:7px;position:relative;display:block}
.brand .logo i:after{content:"";position:absolute;width:7px;height:7px;border:3px solid #fff;border-radius:50%;left:4px;top:4px}
#chapter{font-weight:800;font-size:24px;color:#fff;background:var(--ink);padding:8px 22px;border-radius:999px;white-space:nowrap}
#prog{position:absolute;left:0;right:0;top:0;height:8px;background:rgba(43,35,64,.08)}
#prog i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3))}
#board{position:absolute;left:300px;top:96px;width:1320px;height:668px;background:var(--paper);border-radius:40px;
  box-shadow:0 18px 50px rgba(120,60,120,.13),0 2px 0 rgba(0,0,0,.03);overflow:hidden}
#scene{position:absolute;inset:0;padding:44px 64px}
h2.bt{font-size:50px;font-weight:900;letter-spacing:.01em;line-height:1.2;display:inline-block;position:relative;margin-bottom:30px}
h2.bt:after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:14px;border-radius:8px;z-index:-1;
  background:linear-gradient(90deg,rgba(252,175,69,.55),rgba(225,48,108,.35))}
.tag{display:inline-block;font-size:22px;font-weight:700;color:var(--sub);background:#f4f0f8;border-radius:999px;padding:6px 18px;margin-left:16px;vertical-align:middle}
.grad{background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));-webkit-background-clip:text;background-clip:text;color:transparent}
.banner{position:absolute;left:64px;right:64px;bottom:40px;padding:20px 30px;border-radius:24px;font-size:32px;font-weight:800;color:#fff;
  background:linear-gradient(90deg,var(--ig1),var(--ig2),var(--ig3));box-shadow:0 10px 26px rgba(225,48,108,.25);line-height:1.4}
.note{position:absolute;left:64px;right:64px;bottom:40px;padding:18px 28px;border-radius:22px;font-size:30px;font-weight:800;
  background:#fff7da;border:3px solid #f6cf55;color:#6a4b00;display:flex;gap:16px;align-items:center}
.note b{flex:none;width:44px;height:44px;border-radius:50%;background:#f6b922;color:#fff;display:grid;place-items:center;font-size:28px}
.note.red{background:#ffecec;border-color:#f19a95;color:#8f1d17}.note.red b{background:var(--warn)}

/* title */
.title-wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px}
.kicker{font-size:30px;font-weight:800;color:#fff;padding:10px 30px;border-radius:999px;background:linear-gradient(90deg,var(--gpt),#1a7f9c 50%,var(--ig2))}
.big{font-size:86px;font-weight:900;line-height:1.22;white-space:pre-line}
.subt{font-size:36px;font-weight:700;color:var(--sub)}
.neq{display:flex;align-items:center;gap:26px;font-size:44px;font-weight:900}
.neq span{padding:14px 30px;border-radius:20px;background:#f4f0f8}
.neq em{font-style:normal;color:var(--warn);font-size:70px}

/* chat */
.chatwin{position:absolute;left:64px;right:64px;top:126px;bottom:124px;border:3px solid var(--line);border-radius:28px;overflow:hidden;background:#fbfbfd}
.chathead{height:64px;background:#fff;border-bottom:3px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 26px;font-size:26px;font-weight:800}
.gptlogo{width:38px;height:38px;border-radius:50%;background:var(--gpt);display:grid;place-items:center;color:#fff;font-size:20px;font-weight:900}
.msgs{padding:20px 30px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:78%;padding:14px 26px;border-radius:24px;font-size:29px;line-height:1.45;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:#ede7f8;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:#fff;border:3px solid var(--line);border-bottom-left-radius:6px}
.caret{display:inline-block;width:3px;height:1em;background:var(--ink);vertical-align:-4px;margin-left:2px}

/* list */
.items{display:flex;flex-direction:column;gap:16px}
.item{display:flex;align-items:center;gap:22px;font-size:36px;font-weight:700;padding:12px 22px;border-radius:20px;background:#faf7fc}
.ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:28px}
.ic.worry{background:#ff8a7a}.ic.num{background:linear-gradient(135deg,var(--ig1),var(--ig2))}
.ic.check{background:#fff;border:4px solid var(--ok);color:var(--ok)}

/* stats */
.chart{position:absolute;left:64px;top:150px;width:560px;height:350px}
.bar{position:absolute;bottom:50px;width:170px;border-radius:18px 18px 6px 6px;transform-origin:bottom}
.bar .v{position:absolute;top:-62px;left:-40px;right:-40px;text-align:center;font-size:40px;font-weight:900}
.bar .l{position:absolute;bottom:-48px;left:-40px;right:-40px;text-align:center;font-size:26px;font-weight:700;color:var(--sub)}
.axis{position:absolute;left:0;right:0;bottom:48px;height:4px;background:var(--line);border-radius:2px}
.scard{position:absolute;right:64px;width:560px;height:150px;border-radius:26px;background:#faf7fc;border:3px solid var(--line);padding:20px 30px}
.scard .k{font-size:28px;font-weight:800;color:var(--sub)}
.scard .s{font-size:24px;color:var(--sub);margin-top:4px}
.scard .n{position:absolute;right:30px;top:30px;font-size:80px;font-weight:900;line-height:1}
.scard .n small{font-size:34px;margin-left:6px}
.period{position:absolute;right:64px;top:62px;font-size:24px;font-weight:700;color:var(--sub)}

/* versus */
.vs{position:absolute;left:0;right:0;top:130px;height:380px;display:flex;align-items:center;justify-content:center;gap:120px}
.circ{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center}
.circ .k{font-size:28px;font-weight:800;opacity:.92}
.circ .n{font-size:84px;font-weight:900;line-height:1.05}
.circ .n small{font-size:34px}

/* funnel */
.funnel{position:absolute;left:0;right:0;top:140px;display:flex;flex-direction:column;align-items:center;gap:10px}
.fs{height:70px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:800}

/* roadmap */
.road{position:absolute;left:64px;right:64px;top:150px;bottom:40px}
.rstep{position:absolute;width:282px;height:206px;border-radius:26px;background:#faf7fc;border:3px solid var(--line);padding:18px 10px;text-align:center}
.rstep .no{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:32px;background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3))}
.rstep .tx{font-size:25px;font-weight:800;line-height:1.35;white-space:pre-line}
.rarrow{position:absolute;height:6px;background:#e7d9ef;border-radius:3px}

/* chapter */
.chap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.chap .st{font-size:40px;font-weight:900;letter-spacing:.3em;color:var(--sub)}
.chap .num{width:220px;height:220px;border-radius:50%;display:grid;place-items:center;font-size:130px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--ig1),var(--ig2),var(--ig3),var(--ig4));box-shadow:0 20px 40px rgba(225,48,108,.3)}
.chap .tt{font-size:64px;font-weight:900}

/* sheet */
.sheet{position:absolute;left:64px;right:64px;top:140px;border:3px solid var(--line);border-radius:26px;overflow:hidden}
.row{display:flex;border-bottom:3px solid var(--line);min-height:68px}
.row:last-child{border-bottom:none}
.row .lb{flex:none;width:290px;background:#f7f2fb;font-size:28px;font-weight:800;display:flex;align-items:center;padding:0 24px;color:#5b4a7a}
.row .vl{flex:1;font-size:31px;font-weight:700;display:flex;align-items:center;padding:8px 26px}

/* prompt */
.pbox{position:absolute;left:64px;right:64px;top:140px;bottom:40px;border-radius:26px;background:#1f1b2e;padding:28px 36px;color:#e9e5f5;
  font-size:28px;line-height:1.62;font-weight:500}
.pbox .pl{position:relative;white-space:pre-wrap}
.pbox .hlbg{position:absolute;left:-10px;top:2px;bottom:2px;border-radius:8px;background:rgba(252,175,69,.85);z-index:0}
.pbox .pl span{position:relative;z-index:1}
.pbox .gptbar{position:absolute;right:30px;top:-0px}

/* grid4 */
.g4{position:absolute;left:64px;right:64px;top:140px;bottom:36px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.gc{border-radius:24px;border:3px solid var(--line);overflow:hidden;background:#fff;display:flex;flex-direction:column}
.gc .hd{padding:10px 24px;color:#fff;font-size:32px;font-weight:900;display:flex;flex-direction:column;line-height:1.25}
.gc .hd small{font-size:22px;font-weight:700;opacity:.95}
.gc .bd{padding:12px 24px;font-size:26px;line-height:1.55;font-weight:700}
.gc .bd .m{display:inline-block;margin-top:6px;padding:2px 12px;border-radius:10px;position:relative}
.gc .bd .mbg{position:absolute;inset:0;border-radius:10px;background:#ffe27a;z-index:-1;transform-origin:left}
.gc .bd .m{z-index:0}

/* work */
.phones{position:absolute;left:64px;top:140px;display:flex;gap:28px}
.phone{width:170px;height:300px;border-radius:28px;border:6px solid var(--ink);background:linear-gradient(160deg,#ffd9c7,#f8b7d0);position:relative;overflow:hidden}
.phone .q{position:absolute;inset:0;display:grid;place-items:center;font-size:110px;font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(0,0,0,.12)}
.opts{position:absolute;left:680px;right:64px;top:132px;display:flex;flex-direction:column;gap:11px}
.opts .qq{font-size:34px;font-weight:900;margin-bottom:6px}
.opt{font-size:28px;font-weight:800;padding:8px 22px;border-radius:18px;border:3px dashed #d9cbe6;color:#5b4a7a}

/* ideas */
.idea{position:absolute;width:200px;height:96px;border-radius:18px;color:#fff;font-size:24px;font-weight:800;display:grid;place-items:center;text-align:center;line-height:1.25}
.glabel{position:absolute;font-size:30px;font-weight:900;text-align:center;width:300px}

/* calendar */
.cal{position:absolute;left:64px;right:64px;top:150px;bottom:44px;display:grid;grid-template-columns:2.2fr 1fr 2.2fr 1fr 2.2fr 1fr 1fr;gap:14px}
.day{border-radius:22px;background:#faf7fc;border:3px solid var(--line);position:relative;overflow:hidden}
.day .dn{text-align:center;font-size:34px;font-weight:900;padding:12px 0;border-bottom:3px solid var(--line);background:#fff}
.day .rest{position:absolute;left:0;right:0;top:160px;text-align:center;font-size:30px;font-weight:800;color:#b8aec6}
.post{position:absolute;left:12px;right:12px;top:90px;bottom:14px;border-radius:18px;color:#fff;padding:26px 14px;text-align:center}
.post .fmt{font-size:38px;font-weight:900}
.post .pp{display:inline-block;margin:16px 0;font-size:24px;font-weight:800;background:rgba(255,255,255,.28);padding:3px 10px;border-radius:999px}
.post .th{font-size:30px;font-weight:800;line-height:1.45}

/* flow */
.flow{position:absolute;left:64px;right:64px;top:170px;display:flex;align-items:center;justify-content:space-between}
.fbox{width:262px;height:270px;border-radius:28px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}
.fbox .h{font-size:34px;font-weight:900;white-space:nowrap}
.fbox .d{font-size:24px;font-weight:700;margin-top:12px;opacity:.95}
.farr{width:40px;height:40px;border-top:8px solid #d8c8e6;border-right:8px solid #d8c8e6;transform:rotate(45deg)}

/* twocol */
.cols{position:absolute;left:64px;right:64px;top:140px;bottom:44px;display:flex;gap:30px}
.col{flex:1;border-radius:26px;border:3px solid var(--line);padding:26px 30px;background:#fff}
.col h3{font-size:38px;font-weight:900;margin-bottom:18px}
.cl{display:flex;gap:16px;align-items:center;font-size:34px;font-weight:700;margin:22px 0}
.cl b{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-size:24px}

/* checklist */
.chk{position:absolute;left:64px;right:64px;top:140px;display:flex;flex-direction:column;gap:9px}
.ck{display:flex;align-items:center;gap:20px;font-size:32px;font-weight:700;padding:8px 18px;border-radius:16px;position:relative}
.ck .box{flex:none;width:44px;height:44px;border-radius:10px;border:4px solid #c9bdd6;position:relative;background:#fff}
.ck .box svg{position:absolute;left:-2px;top:-8px}
.ck .hbg{position:absolute;inset:0;border-radius:16px;background:#ffefc2;z-index:-1;transform-origin:left}
.ck{z-index:0}

/* metrics */
.mets{position:absolute;left:64px;right:64px;top:160px;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.mc{height:400px;border-radius:26px;padding:26px 20px;text-align:center;border:3px solid var(--line);background:#fff;position:relative}
.mc .ico{width:90px;height:90px;border-radius:24px;margin:0 auto 18px;display:grid;place-items:center}
.mc .h{font-size:31px;font-weight:900;line-height:1.25;min-height:80px;display:flex;align-items:center;justify-content:center}
.mc .d{font-size:26px;font-weight:700;color:var(--sub);margin-top:12px;line-height:1.5}
.neqmark{position:absolute;left:321px;top:300px;width:70px;height:70px;border-radius:50%;background:var(--warn);color:#fff;font-size:50px;font-weight:900;display:grid;place-items:center;z-index:2}

/* calc */
.formula{position:absolute;left:64px;right:64px;top:160px;display:flex;align-items:center;justify-content:center;gap:24px}
.fbx{white-space:pre;padding:22px 28px;border-radius:22px;background:#f4f0f8;font-size:34px;font-weight:900;text-align:center;line-height:1.3}
.op{font-size:64px;font-weight:900;color:var(--sub)}
.stamp{position:absolute;left:50%;top:150px;width:200px;height:200px;margin-left:-100px}
.calcmsg{position:absolute;left:64px;right:64px;top:345px;text-align:center;font-size:36px;font-weight:900;color:var(--warn)}
.zero{position:absolute;left:64px;right:64px;bottom:40px;height:130px;border-radius:24px;background:#eefaf4;border:3px solid #9fdcbf;display:flex;align-items:center;gap:26px;padding:0 34px}
.zero .z{font-size:46px;font-weight:900;color:#0d6e48;white-space:nowrap}
.zero .t{font-size:29px;font-weight:800;color:#0d6e48}

/* steps */
.stp{position:absolute;left:64px;right:64px;top:146px;display:flex;flex-direction:column;gap:14px}
.sp{display:flex;align-items:center;gap:22px;font-size:33px;font-weight:800;background:#faf7fc;border-radius:20px;padding:14px 22px}
.sp .n{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--ig1),var(--ig2))}

/* weeks */
.wk{position:absolute;left:64px;right:64px;top:146px;bottom:40px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.wc{border-radius:26px;overflow:hidden;border:3px solid var(--line);background:#fff}
.wc .hd{padding:16px;color:#fff;text-align:center}
.wc .hd .w{font-size:24px;font-weight:800;opacity:.9}
.wc .hd .tt{font-size:32px;font-weight:900}
.wc ul{list-style:none;padding:16px 18px}
.wc li{font-size:26px;font-weight:700;padding:16px 4px 16px 40px;position:relative;line-height:1.4;border-bottom:2px dashed var(--line)}
.wc li:last-child{border-bottom:none}
.wc li:before{content:"";position:absolute;left:4px;top:17px;width:22px;height:22px;border-radius:6px;border:3px solid #c9bdd6}

/* ending */
.endq{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px;text-align:center}
.endq .q{font-size:62px;font-weight:900;line-height:1.5;white-space:pre-line}
.subbtn{display:flex;gap:22px;align-items:center}
.subbtn .like,.subbtn .sb{font-size:36px;font-weight:900;padding:18px 40px;border-radius:999px;color:#fff}
.subbtn .like{background:#3d3550}.subbtn .sb{background:#e62117}

/* characters */
.char{position:absolute;bottom:-6px;width:340px;height:520px;transform-origin:50% 100%}
#charH{left:-14px}#charK{right:-14px}
.mark{position:absolute;font-weight:900}

/* subtitle */
#sub{position:absolute;left:330px;right:330px;top:790px;height:250px;display:flex;align-items:center}
#subbox{position:relative;width:100%;min-height:160px;background:#fff;border-radius:30px;border:5px solid var(--H);padding:30px 44px 26px;
  box-shadow:0 12px 30px rgba(80,40,90,.14);font-size:41px;font-weight:800;line-height:1.48;line-break:strict}
#subname{position:absolute;top:-26px;left:34px;color:#fff;font-size:26px;font-weight:900;padding:6px 22px;border-radius:999px;background:var(--H)}
#subtail{position:absolute;bottom:40px;width:0;height:0;border:22px solid transparent}
#preload{position:absolute;left:0;top:0;opacity:0;font-size:10px;width:10px;height:10px;overflow:hidden}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1" style="width:520px;height:520px;left:-160px;top:-180px;background:radial-gradient(#ffd6a8,transparent 70%)"></div>
  <div class="blob" id="b2" style="width:600px;height:600px;right:-200px;top:300px;background:radial-gradient(#f5c2e2,transparent 70%)"></div>
  <div class="blob" id="b3" style="width:460px;height:460px;left:700px;top:760px;background:radial-gradient(#d9c9ff,transparent 70%)"></div>
  <div id="dots"></div>
  <div id="prog"><i></i></div>
  <div id="topbar">
    <div class="brand"><div class="logo"><i></i></div>ChatGPT×Instagram 運用講座</div>
    <div id="chapter"></div>
  </div>
  <div id="board"><div id="scene"></div></div>
  <div class="char" id="charH"></div>
  <div class="char" id="charK"></div>
  <div id="sub"><div id="subbox"><div id="subname"></div><div id="subtext"></div></div></div>
  <div id="preload"></div>
</div>
<script src="build/timeline.js"></script>
<script src="anim.js"></script>
</body>
</html>
